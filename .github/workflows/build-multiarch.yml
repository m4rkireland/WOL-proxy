name: Test, scan and publish maintained relay
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto
      - run: python -m unittest -v
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local scan candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wol-proxy:candidate
      - name: Gate fixed HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wol-proxy:candidate
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select immutable and release tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re
          image='ghcr.io/m4rkireland/wol-proxy'
          tags=[image+':latest',image+':'+os.environ['REVISION']]
          if os.environ['REF_TYPE']=='tag':
              version=os.environ['REF_NAME']
              if not re.fullmatch(r'v\d+\.\d+\.\d+',version):raise SystemExit('Release tag must be vX.Y.Z')
              tags.append(image+':'+version)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('images='+','.join(tags)+'\n')
          PY
      - name: Publish immutable revision and maintained latest
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.images }}
